name: Security Audit

on:
  # Run every Monday at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:

  # Run when dependency or audit policy changes on main
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'

jobs:
  security_audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Prebuilt binary from GitHub Releases (much faster than cargo install)
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Default cargo-audit: exit non-zero on vulnerabilities; warn (don't fail) on
      # informational advisories like unmaintained. Accepted vulns live in .cargo/audit.toml.
      - name: Run cargo audit
        run: |
          set -o pipefail
          cargo-audit --color=always 2>&1 | tee audit.log

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-results
          path: audit.log
          retention-days: 90
